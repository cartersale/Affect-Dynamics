# Configuration for the main analysis script.

data:
  # Directory where the processed Parquet files are located.
  processed_dir: data/processed

analysis:
  # Directory where the analysis results (CSV files) will be saved.
  out_dir: artifacts/

  # Number of folds for cross-validation. Dyads are kept together in folds
  # to prevent data leakage.
  n_splits: 5

  # Laplace smoothing parameter (alpha) for the Markov models.
  # This helps to handle unseen transitions in the data.
  alpha: 1.0

  # --- Analysis Toggles ---
  # Set these to true to run the corresponding analysis.

  # Compares a coupled Markov model (M1) vs. an independent one (M0).
  run_coupling_test: true

  # Decomposes coupling into client->therapist and therapist->client influence.
  run_directionality_test: true

  # --- HMM Configuration ---
  run_hmm_fitting: true
  hmm_out_dir: "artifacts/chmm"
  hmm_n_splits: 5
  hmm_k_min: 2
  hmm_k_max: 8
  hmm_n_iter: 150
  hmm_tol: 1.0e-4
  hmm_alpha_trans: [1.0]
  hmm_alpha_emit: [1.0]
  hmm_n_restarts: 3

  # --- Joint Affect catRQA by Regime ---
  run_joint_affect_catrqa: true
  joint_affect_catrqa:
    hmm_dir: "artifacts/chmm"
    processed_data_dir: "data/processed"
    out_dir: "artifacts/joint_affect_catRQA"
    n_min: 10
    plot_n_min: 30
    theiler_w: 1
    l_min: 2
    v_min: 2
    n_null: 100
    random_seed: 42
    n_example_plots: 1

  # --- Joint Affect Grammar Motifs by Regime ---
  run_joint_affect_grammar: true
  joint_affect_grammar:
    hmm_dir: "artifacts/chmm"
    processed_data_dir: "data/processed"
    out_dir: "artifacts/joint_affect_grammar"
    n_min: 10
    ks: [2, 3]
    top_n: 5
    n_null: 200
    random_seed: 42
    min_null_windows: 15
    min_null_duration: 30

