[project]
name = "affectdynamics"
version = "0.0.1"
requires-python = ">=3.11"

dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "seaborn>=0.13",
  "scikit-posthocs>=0.9",
  "tqdm>=4.66",
  "scikit-learn>=1.5",
  "scipy>=1.11",
  "hmmlearn>=0.3",
  "umap-learn>=0.5",
  "mlflow>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pre-commit>=3.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
